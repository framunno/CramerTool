name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (Release)
            os: windows-latest
            build_type: Release
          - name: Linux (Release)
            os: ubuntu-24.04
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # The Linux runner needs the X libraries Qt widgets link against.
      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCRAMERTOOL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # The tests are headless (QTEST_APPLESS_MAIN), so no display is needed.
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Package
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Upload the application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CramerTool-win64
          path: build/dist/*.zip
